
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#477a55">
  <title>Prueba Supabase · Mi Despensa</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 560px;
      margin: 30px auto;
      padding: 20px;
      background: #f5f6f0;
      color: #20352a;
    }
    section {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 16px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 9px;
      font: inherit;
    }
    input { border: 1px solid #ccd6ce; }
    button {
      border: 0;
      background: #234c3b;
      color: white;
      font-weight: bold;
    }
    #estado { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>🥫 Mi Despensa</h1>
  <p>Prueba de conexión segura con Supabase.</p>

  <section>
    <h2>Iniciar sesión</h2>
    <form id="acceso">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" required autocomplete="email">

      <label for="password">Contraseña de Supabase</label>
      <input id="password" type="password" required
        autocomplete="current-password">

      <button type="submit">Iniciar sesión</button>
    </form>
    <button id="salir" type="button">Cerrar sesión</button>
    <p id="estado" aria-live="polite">Preparando conexión…</p>
  </section>

  <section>
    <h2>Comprobar inventario</h2>
    <button id="comprobar" type="button">
      Consultar mis productos
    </button>
    <p id="resultado" aria-live="polite"></p>
  </section>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const URL_SUPABASE =
      "https://wfbhrqlmfhjnjmdzeodi.supabase.co";

    const CLAVE_PUBLICA =
      "sb_publishable_6h-DRmPa61Jw8XVBfqLbyw_Uxbtzjl8";

    const supabase = createClient(URL_SUPABASE, CLAVE_PUBLICA);

    const estado = document.getElementById("estado");
    const resultado = document.getElementById("resultado");

    async function actualizarSesion() {
      const { data, error } = await supabase.auth.getSession();

      if (error) {
        estado.textContent = "Error de sesión: " + error.message;
        return;
      }

      estado.textContent = data.session
        ? "Sesión iniciada: " + data.session.user.email
        : "Conexión preparada. Inicia sesión para continuar.";
    }

    document.getElementById("acceso").addEventListener(
      "submit", async event => {
        event.preventDefault();
        estado.textContent = "Iniciando sesión…";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { error } = await supabase.auth.signInWithPassword({
          email, password
        });

        if (error) {
          estado.textContent = "No se pudo iniciar sesión: " + error.message;
          return;
        }

        document.getElementById("password").value = "";
        await actualizarSesion();
      }
    );

    document.getElementById("salir").addEventListener("click", async () => {
      const { error } = await supabase.auth.signOut();
      estado.textContent = error
        ? "Error al cerrar sesión: " + error.message
        : "Sesión cerrada.";
      resultado.textContent = "";
    });

    document.getElementById("comprobar").addEventListener("click", async () => {
      resultado.textContent = "Consultando…";

      const { data: sesion } = await supabase.auth.getSession();

      if (!sesion.session) {
        resultado.textContent = "Primero debes iniciar sesión.";
        return;
      }

      const { data, error } = await supabase
        .from("productos")
        .select("id, nombre, cantidad, actualizado_en, eliminado_en")
        .order("nombre");

      if (error) {
        resultado.textContent = "Error al consultar: " + error.message;
        return;
      }

      resultado.textContent =
        "Conexión correcta. Filas de tu cuenta: " + data.length +
        ". No se ha modificado ningún producto.";
    });

    await actualizarSesion();
  </script>
</body>
</html>
