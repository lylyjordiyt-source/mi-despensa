
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#477a55">
<title>Prueba de sincronización · Mi Despensa</title>
<style>
body {
  font-family: system-ui, sans-serif;
  max-width: 600px;
  margin: 20px auto;
  padding: 16px;
  background: #f5f6f0;
  color: #20352a;
}
section {
  background: white;
  padding: 18px;
  border-radius: 16px;
  margin: 16px 0;
}
input, textarea, button {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  margin: 6px 0 12px;
  border-radius: 9px;
  font: inherit;
}
input, textarea { border: 1px solid #ccd6ce; }
textarea { min-height: 130px; }
button {
  border: 0;
  background: #234c3b;
  color: white;
  font-weight: bold;
}
button:disabled { opacity: .5; }
p { overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>🥫 Mi Despensa</h1>
<p>Prueba de subida segura. No modifica tu inventario habitual.</p>

<section>
<h2>1. Iniciar sesión</h2>
<form id="login">
<label for="email">Correo de Supabase</label>
<input id="email" type="email" autocomplete="email" required>
<label for="password">Contraseña</label>
<input id="password" type="password"
 autocomplete="current-password" required>
<button type="submit">Iniciar sesión</button>
</form>
<button id="salir" type="button">Cerrar sesión</button>
<p id="estado">Conectando…</p>
</section>

<section>
<h2>2. Preparar productos</h2>
<p>Pega una copia de seguridad de Mi Despensa en formato JSON.
Primero se validará; todavía no se subirá nada.</p>
<textarea id="copia" placeholder='Pega aquí la copia que guardaste en Notas'></textarea>
<button id="validar" type="button">Validar copia</button>
<p id="validacion" aria-live="polite"></p>
</section>

<section>
<h2>3. Revisar y subir</h2>
<p id="resumen"></p>
<button id="subir" type="button" disabled>Subir productos a mi cuenta</button>
<p id="resultado" aria-live="polite"></p>
</section>

<script type="module">
import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const URL_SUPABASE =
  "https://wfbhrqlmfhjnjmdzeodi.supabase.co";
const CLAVE_PUBLICA =
  "sb_publishable_6h-DRmPa61Jw8XVBfqLbyw_Uxbtzjl8";

const supabase = createClient(URL_SUPABASE, CLAVE_PUBLICA);
const $ = id => document.getElementById(id);

let listaValidada = null;
let usuarioActual = null;

function mostrarEstado(texto) {
  $("estado").textContent = texto;
}

async function comprobarSesion() {
  const { data, error } = await supabase.auth.getSession();
  if (error) {
    mostrarEstado("Error de sesión: " + error.message);
    return;
  }
  usuarioActual = data.session?.user ?? null;
  mostrarEstado(usuarioActual
    ? "Sesión iniciada: " + usuarioActual.email
    : "Inicia sesión para continuar.");
  $("subir").disabled = !usuarioActual || !listaValidada;
}

$("login").addEventListener("submit", async e => {
  e.preventDefault();
  mostrarEstado("Iniciando sesión…");
  const { data, error } = await supabase.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value
  });
  if (error) {
    mostrarEstado("Error al iniciar sesión: " + error.message);
    return;
  }
  $("password").value = "";
  usuarioActual = data.user;
  await comprobarSesion();
});

$("salir").addEventListener("click", async () => {
  await supabase.auth.signOut();
  usuarioActual = null;
  $("subir").disabled = true;
  mostrarEstado("Sesión cerrada.");
});

$("validar").addEventListener("click", () => {
  listaValidada = null;
  $("subir").disabled = true;
  $("resumen").textContent = "";
  try {
    const copia = JSON.parse($("copia").value.trim());
    const lista = Array.isArray(copia) ? copia : copia.productos;

    if (!Array.isArray(lista)) throw new Error("No se encontró la lista.");

    const productos = lista.map(p => {
      if (!p || typeof p.nombre !== "string" ||
          !p.nombre.trim() || p.nombre.trim().length > 80 ||
          !Number.isInteger(Number(p.cantidad)) ||
          Number(p.cantidad) < 0) {
        throw new Error("Hay un producto con datos no válidos.");
      }
      return {
        id: typeof p.id === "string" && p.id.trim()
          ? p.id : crypto.randomUUID(),
        nombre: p.nombre.trim(),
        cantidad: Number(p.cantidad)
      };
    });

    const ids = new Set();
    for (const p of productos) {
      if (ids.has(p.id)) throw new Error("Hay identificadores duplicados.");
      ids.add(p.id);
    }

    listaValidada = productos;
    $("validacion").textContent = "Copia válida.";
    $("resumen").textContent =
      "Se preparan " + productos.length +
      " productos. No se ha subido nada todavía.";
    $("subir").disabled = !usuarioActual;
  } catch (error) {
    $("validacion").textContent =
      "No se pudo validar: " + error.message;
  }
});

$("subir").addEventListener("click", async () => {
  if (!usuarioActual || !listaValidada) return;

  $("subir").disabled = true;
  $("resultado").textContent = "Comprobando la cuenta…";

  try {
    const { data: sesionData, error: sesionError } =
      await supabase.auth.getSession();
    if (sesionError || !sesionData.session) {
      throw new Error("La sesión ha caducado. Inicia sesión otra vez.");
    }

    const usuario = sesionData.session.user;

    const { data: existentes, error: consultaError } = await supabase
      .from("productos")
      .select("id, nombre, cantidad, eliminado_en")
      .eq("user_id", usuario.id);

    if (consultaError) throw consultaError;

    if (existentes.length > 0) {
      $("resultado").textContent =
        "Subida cancelada por seguridad: tu cuenta ya contiene " +
        existentes.length + " filas. No se ha cambiado nada.";
      return;
    }

    if (!confirm(
      "Se van a subir " + listaValidada.length +
      " productos a tu cuenta de Supabase. ¿Continuar?"
    )) return;

    const filas = listaValidada.map(p => ({
      id: p.id,
      nombre: p.nombre,
      cantidad: p.cantidad,
      user_id: usuario.id
    }));

    if (filas.length === 0) {
      $("resultado").textContent =
        "La copia no contiene productos. No se ha subido nada.";
      return;
    }

    const { error: subidaError } = await supabase
      .from("productos")
      .insert(filas);

    if (subidaError) throw subidaError;

    $("resultado").textContent =
      "¡Subida completada! Productos guardados: " +
      filas.length + ". Tu inventario local no se ha modificado.";
  } catch (error) {
    $("resultado").textContent =
      "No se completó la subida: " + error.message;
  } finally {
    await comprobarSesion();
  }
});

await comprobarSesion();
</script>
</body>
</html>
